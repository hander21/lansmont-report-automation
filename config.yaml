input_folder: "samples/fake_test_001"
output_folder: "output/Packaging Test Reports"

# Template paths — selected automatically based on test_standard in SUMMARY.csv
template_path:       "templates/fake_3b_template.docx"   # fallback default
ista3b_template_path: "templates/fake_3b_template.docx"
ista3a_template_path: "templates/fake_3a_template.docx"

required_files:
  summary_data: true
  charts: true
  # Photos are never required — missing slots remain as placeholders for
  # manual insertion by the engineer in Word after report generation.
  pre_test_photos: false
  post_test_photos: false

photo_settings:
  max_width_inches: 3.0
  max_height_inches: 2.5

chart_settings:
  max_width_inches: 6.0
  max_height_inches: 4.0

report_settings:
  mark_as_draft: true
  export_pdf: false

# Recognized file name patterns (case-insensitive prefix matching)
file_patterns:
  summary_prefixes:
    - "SUMMARY"
    - "TEST_SUMMARY"
    - "LANSMONT_SUMMARY"
  chart_prefixes:
    - "CHART_"
  pre_test_photo_prefixes:
    - "PRE_"
  post_test_photo_prefixes:
    - "POST_"
  accel_photo_prefixes:
    - "ACCEL_"
  seq_photo_prefixes:
    - "SEQ"

# Extensions accepted for each file type
file_extensions:
  summary: [".csv", ".xlsx", ".txt"]
  charts: [".png", ".jpg", ".jpeg", ".pdf"]
  photos: [".jpg", ".jpeg", ".png"]

confidentiality:
  allow_real_customer_data: false
  allow_real_product_photos: false
  allow_real_company_files: false
